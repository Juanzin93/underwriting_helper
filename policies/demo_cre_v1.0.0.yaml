# ============================================================================
# ILLUSTRATIVE DEMO POLICY — NOT A LENDING STANDARD (commercial real estate)
# Property-level underwriting uses NOI, not business EBITDA.
# ============================================================================
policy_key: demo_cre
version: "1.0.0"
name: "Demo Commercial Real Estate Policy"
module: commercial
loan_types: [commercial_real_estate]
effective_date: 2026-01-01
illustrative: true
disclaimer: >-
  ILLUSTRATIVE thresholds for software testing only. Not a universal standard,
  not lender guidance, not legal or credit advice.
source_description: "Synthetic demo policy authored for UW Helper; no external source."
parameters:
  collateral_advance_rates:
    real_estate: 0.75
    other: 0.0
rules:
  - id: PROPERTY_DSCR_MIN
    version: 1
    description: "Property DSCR (NOI / proposed debt service) at least 1.25x (illustrative)"
    type: metric_threshold
    metric: dscr_property
    operator: ">="
    threshold: 1.25
    round_to: 2
    severity: high
  - id: CRE_LTV_MAX
    version: 1
    description: "LTV at most 75% (illustrative)"
    type: metric_threshold
    metric: ltv
    operator: "<="
    threshold: 0.75
    round_to: 4
    severity: high
  - id: DEBT_YIELD_MIN
    version: 1
    description: "Debt yield at least 9% (illustrative)"
    type: metric_threshold
    metric: debt_yield
    operator: ">="
    threshold: 0.09
    round_to: 4
    severity: medium
  - id: CRE_VALUATION_AGE
    version: 1
    description: "Appraisal no older than 365 days (illustrative)"
    type: valuation_age
    max_age_days: 365
    severity: high
  - id: CRE_DOCS
    version: 1
    description: "Appraisal, rent roll and operating statement on file"
    type: documents_present
    documents: [appraisal, rent_roll, operating_statement]
    severity: medium
  - id: CRE_PROPERTY_INPUTS
    version: 1
    description: "Property operating inputs present and verified"
    type: inputs_present
    required_inputs: [gross_potential_rent, vacancy_credit_loss, other_property_income, property_operating_expenses]
    severity: high
  - id: CRE_NO_CONTRADICTIONS
    version: 1
    description: "No unresolved contradictions between source documents"
    type: no_contradictions
    severity: high
